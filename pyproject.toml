[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nzb-compass"
version = "0.4.0"
description = "A native GTK client for searching Prowlarr and sending releases to SABnzbd"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyGObject>=3.46"]

[project.scripts]
nzb-compass = "nzb_compass.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
