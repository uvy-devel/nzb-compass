name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v6
      - name: Install test and build dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          python python-gobject gtk4 libadwaita desktop-file-utils
          python-build python-installer python-wheel
      - name: Run tests
        run: make test
      - name: Validate desktop launcher and versions
        run: make validate-desktop check-version
      - name: Build Python wheel
        run: make build
